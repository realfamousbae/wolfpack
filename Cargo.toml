[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/realfamousbae/Wolfpack"

[workspace.dependencies]
wolf_span = { path = "crates/wolf_span" }
wolf_diag = { path = "crates/wolf_diag" }
wolf_lexer = { path = "crates/wolf_lexer" }
wolf_ast = { path = "crates/wolf_ast" }
wolf_parser = { path = "crates/wolf_parser" }
wolf_std = { path = "crates/wolf_std" }
wolf_project = { path = "crates/wolf_project" }
wolf_resolve = { path = "crates/wolf_resolve" }
wolf_types = { path = "crates/wolf_types" }
wolf_ir = { path = "crates/wolf_ir" }
wolf_own = { path = "crates/wolf_own" }
wolf_ts = { path = "crates/wolf_ts" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
