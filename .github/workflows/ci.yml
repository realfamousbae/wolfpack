name: CI

on:
  push:
    branches: [master, night]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The end-to-end tests build the generated TypeScript and run it with Node.js.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g typescript@5
      # And the generated Go with the oldest supported Go (spec chapter 8).
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The compiler of the playground builds for WebAssembly, and its page is valid JavaScript.
      - run: cargo build --release -p wolfpack-wasm --target wasm32-unknown-unknown
      - run: node --check playground/app.js
      # The generated Rust promises `rust-version = "1.85"` (spec chapter 8): build the examples,
      # the run programs and the native modules with Rust code with that toolchain.
      - run: rustup toolchain install 1.85.0 --profile minimal
      - name: Build the generated Rust with Rust 1.85
        run: |
          for project in examples/*/ crates/wolf_cli/tests/run/*/ crates/wolf_cli/tests/native_modules/*/; do
            name=$(basename "$project")
            # Programs that show an error (E07xx, E08xx) are rejected on purpose: not built.
            case "$name" in E07*|E08*) continue ;; esac
            # A native module without Rust code is not built for Rust.
            case "$project" in */native_modules/*) [ -d "$project/native/rust" ] || continue ;; esac
            out="$RUNNER_TEMP/rust-1.85/$name"
            (cd "$project" && "$GITHUB_WORKSPACE/target/debug/wolf" build --target rust --out "$out")
            cargo +1.85.0 build --quiet --all-targets --manifest-path "$out/Cargo.toml"
          done
