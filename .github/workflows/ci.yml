name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The end-to-end tests build the generated TypeScript and run it with Node.js.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g typescript@5
      # And the generated Go with the oldest supported Go (spec chapter 8).
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The generated Rust promises `rust-version = "1.85"` (spec chapter 8): build the examples
      # and the run programs with that toolchain.
      - run: rustup toolchain install 1.85.0 --profile minimal
      - name: Build the generated Rust with Rust 1.85
        run: |
          for project in examples/*/ crates/wolf_cli/tests/run/*/; do
            name=$(basename "$project")
            out="$RUNNER_TEMP/rust-1.85/$name"
            (cd "$project" && "$GITHUB_WORKSPACE/target/debug/wolf" build --target rust --out "$out")
            cargo +1.85.0 build --quiet --all-targets --manifest-path "$out/Cargo.toml"
          done
