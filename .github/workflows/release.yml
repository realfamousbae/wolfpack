name: Release

# A tag `v<version>` builds wolf for every platform, packs the installers, tries each of them and
# `wolf self update` on a clean machine and creates a draft release with the files. Run by hand (workflow_dispatch), it
# does the same without a release, so the installers can be tested before tagging.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          # The oldest supported Ubuntu, so the binary runs on older glibc versions too.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: The tag matches the version of the crates
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME"
      - run: cargo build --release --locked -p wolfpack-lang --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: wolf-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/wolf${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error

  package-macos:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wolf-*-apple-darwin
      - name: A universal binary, the archive and the package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          mkdir -p dist universal
          lipo -create -output universal/wolf \
            wolf-aarch64-apple-darwin/wolf wolf-x86_64-apple-darwin/wolf
          chmod 755 universal/wolf
          tar -czf dist/wolfpack-macos-universal.tar.gz -C universal wolf
          release/macos/build-pkg.sh "$version" universal/wolf dist
          pkgutil --payload-files "dist/wolfpack-$version-macos.pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: package-macos
          path: dist/*

  package-linux:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wolf-*-linux-gnu
      - run: |
          mkdir -p dist
          chmod 755 wolf-*/wolf
          tar -czf dist/wolfpack-linux-x64.tar.gz -C wolf-x86_64-unknown-linux-gnu wolf
          tar -czf dist/wolfpack-linux-arm64.tar.gz -C wolf-aarch64-unknown-linux-gnu wolf
      - uses: actions/upload-artifact@v4
        with:
          name: package-linux
          path: dist/*

  package-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wolf-x86_64-pc-windows-msvc
          path: stage
      - name: The installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"$').Matches[0].Groups[1].Value
          Copy-Item LICENSE-MIT, LICENSE-APACHE stage/
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" "/DVersion=$version" "/DSource=$PWD\stage" "/DOutput=$PWD\dist" release\windows\wolfpack.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path stage\wolf.exe -DestinationPath dist\wolfpack-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: dist/*

  # Each installer on a clean machine: install, `wolf setup`, then a program on every target.
  try:
    needs: [package-macos, package-linux, package-windows]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Install on macOS
        if: runner.os == 'macOS'
        run: |
          sudo installer -pkg dist/wolfpack-*-macos.pkg -target /
          wolf setup
          echo "WOLF=/usr/local/bin/wolf" >> "$GITHUB_ENV"
      - name: Install on Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$HOME/.local/bin"
          tar -xzf dist/wolfpack-linux-x64.tar.gz -C "$HOME/.local/bin"
          "$HOME/.local/bin/wolf" setup
          echo "WOLF=$HOME/.local/bin/wolf" >> "$GITHUB_ENV"
      - name: Install on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\wolfpack-*-windows-x64-setup.exe | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/LOG=install.log'
          Get-Content install.log -Tail 20
          "WOLF=$env:LOCALAPPDATA\Programs\wolfpack\bin\wolf.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: A program on every target
        shell: bash
        run: |
          "$WOLF" setup --check
          "$WOLF" new hello
          cd hello
          for target in ts go rust; do
            test "$("$WOLF" run --target "$target")" = "Hello, wolfpack!"
          done

  # The terminal installers on a clean machine, with the files of this run instead of a release.
  try-scripts:
    needs: [package-macos, package-linux, package-windows]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: The sums, as the release has them
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum -- * > SHA256SUMS.txt; else shasum -a 256 -- * > SHA256SUMS.txt; fi
      - name: install.sh, twice and into another directory
        if: runner.os != 'Windows'
        env:
          WOLFPACK_DOWNLOAD_URL: file://${{ github.workspace }}/dist
          WOLFPACK_NO_SETUP: "1"
        run: |
          # A short PATH, so the profiles must be changed even where ~/.local/bin is on PATH.
          env PATH=/usr/bin:/bin:/usr/sbin:/sbin sh release/install.sh
          env PATH=/usr/bin:/bin:/usr/sbin:/sbin sh release/install.sh
          sh release/install.sh --dir "$HOME/other-bin" --no-modify-path
          "$HOME/.local/bin/wolf" --version
          "$HOME/other-bin/wolf" --version
          test "$(grep -c 'wolfpack installer' "$HOME/.profile")" = 1
      - name: install.ps1 in Windows PowerShell 5.1, twice
        if: runner.os == 'Windows'
        shell: powershell
        env:
          WOLFPACK_DOWNLOAD_URL: ${{ github.workspace }}\dist
          WOLFPACK_NO_SETUP: "1"
        run: |
          Get-Content -Raw release\install.ps1 | Invoke-Expression
          Get-Content -Raw release\install.ps1 | Invoke-Expression
          & "$env:LOCALAPPDATA\Programs\wolfpack\bin\wolf.exe" --version
          $path = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($path -split ';' | Where-Object { $_ -like '*Programs\wolfpack\bin' }).Count -ne 1) { throw "PATH: $path" }
      - name: install.ps1 in PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WOLFPACK_DOWNLOAD_URL: ${{ github.workspace }}\dist
          WOLFPACK_NO_SETUP: "1"
          WOLFPACK_INSTALL_DIR: ${{ runner.temp }}\wolf7
        run: |
          Get-Content -Raw release\install.ps1 | Invoke-Expression
          & "$env:WOLFPACK_INSTALL_DIR\wolf.exe" --version

  # `wolf self update` on a clean machine (spec chapter 8, section 2b): the wolf of this run, put
  # in place by the terminal installer, replaces itself with a real release of GitHub. The oldest
  # release is used because it is always there; it proves the download, the check of the sum, the
  # start of the new wolf and the replacement of the running one.
  try-update:
    needs: [package-macos, package-linux, package-windows]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: The sums, as the release has them
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum -- * > SHA256SUMS.txt; else shasum -a 256 -- * > SHA256SUMS.txt; fi
      - name: Install with install.sh, then update to another release
        if: runner.os != 'Windows'
        env:
          WOLFPACK_DOWNLOAD_URL: file://${{ github.workspace }}/dist
          WOLFPACK_NO_SETUP: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          sh release/install.sh
          wolf="$HOME/.local/bin/wolf"
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          "$wolf" --version | grep -F "$version"
          # Only asks: 0 when this is the latest release, 1 when a newer one exists.
          code=0
          "$wolf" self update --check || code=$?
          test "$code" = 0 || test "$code" = 1
          "$wolf" self update --version 0.1.1
          "$wolf" --version | grep -F "0.1.1"
      - name: Install with install.ps1, then update to another release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WOLFPACK_DOWNLOAD_URL: ${{ github.workspace }}\dist
          WOLFPACK_NO_SETUP: "1"
        run: |
          Get-Content -Raw release\install.ps1 | Invoke-Expression
          $wolf = "$env:LOCALAPPDATA\Programs\wolfpack\bin\wolf.exe"
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"$').Matches[0].Groups[1].Value
          if (-not ((& $wolf --version) -match [regex]::Escape($version))) { throw "not $version" }
          & $wolf self update --check
          if ($LASTEXITCODE -gt 1) { throw "--check failed: $LASTEXITCODE" }
          & $wolf self update --version 0.1.1
          if ($LASTEXITCODE -ne 0) { throw "self update failed: $LASTEXITCODE" }
          if (-not ((& $wolf --version) -match '0\.1\.1')) { throw "not 0.1.1" }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [try, try-scripts, try-update]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: A draft release with the files and their sums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp release/install.sh release/install.ps1 dist/
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
            --title "wolfpack ${GITHUB_REF_NAME#v}" \
            --notes "See CHANGELOG.md for what this release contains, and README.md for how to install it."
