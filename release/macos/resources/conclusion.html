<h2>wolf is installed</h2>
<p>Open a new Terminal window and try:</p>
<pre>wolf new hello
cd hello
wolf run</pre>
<p><code>wolf setup --check</code> shows the installed tools; if a download failed,
<code>wolf setup</code> installs what is missing. Rust also needs the Command Line Tools of
Xcode; if macOS asks to install them, accept.</p>
