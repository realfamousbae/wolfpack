[package]
name = "wolfpack-lang"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["compiler", "language", "typescript", "golang", "transpiler"]
categories = ["compilers", "command-line-utilities"]
description = "Wolfpack: a language that compiles to readable TypeScript, Go and Rust. The wolf command"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
codespan-reporting = "0.13.1"
wolf_ast = { workspace = true }
wolf_diag = { workspace = true }
wolf_driver = { workspace = true }
wolf_fmt = { workspace = true }
wolf_lexer = { workspace = true }
wolf_parser = { workspace = true }
wolf_project = { workspace = true }
wolf_resolve = { workspace = true }
wolf_types = { workspace = true }
wolf_ir = { workspace = true }
wolf_own = { workspace = true }
wolf_ts = { workspace = true }
wolf_go = { workspace = true }
wolf_rs = { workspace = true }
wolf_span = { workspace = true }
wolf_std = { workspace = true }
ureq = "3.4.2"
sha2 = "0.11.0"
flate2 = "1.1.10"
tar = "0.4.46"
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[[bin]]
name = "wolf"
path = "src/main.rs"
