[package]
name = "wolfpack-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The wolfpack compiler for the browser playground"

[lib]
name = "wolf_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wolf_diag = { workspace = true }
wolf_driver = { workspace = true }
wolf_fmt = { workspace = true }
wolf_ir = { workspace = true }
wolf_project = { workspace = true }
wolf_span = { workspace = true }
wolf_vm = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
wolf_lexer = { workspace = true }

[lints]
workspace = true
