# Fuzz targets (spec chapter 9, section 5): the compiler must never panic on any input.
# `lexer` lexes and parses; `pipeline` checks, builds for every target and formats, as the
# playground does. Run with `cargo +nightly fuzz run pipeline -- -dict=fuzz/wolf.dict`, after
# copying the programs of the repository into the corpus:
# `mkdir -p fuzz/corpus/pipeline && find examples crates -name '*.wolf' -exec cp {} fuzz/corpus/pipeline/ \;`
# (needs `cargo install cargo-fuzz`). The test `crates/wolf_wasm/tests/mutations.rs` does the same
# on stable Rust with programs near those of the repository.
# This is a separate workspace, so `cargo test` at the root does not build it.

[package]
name = "wolf_fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
wolf_span = { package = "wolfpack-span", path = "../crates/wolf_span" }
wolf_diag = { package = "wolfpack-diag", path = "../crates/wolf_diag" }
wolf_lexer = { package = "wolfpack-lexer", path = "../crates/wolf_lexer" }
wolf_parser = { package = "wolfpack-parser", path = "../crates/wolf_parser" }
wolf_ast = { package = "wolfpack-ast", path = "../crates/wolf_ast" }
wolf_driver = { package = "wolfpack-driver", path = "../crates/wolf_driver" }
wolf_fmt = { package = "wolfpack-fmt", path = "../crates/wolf_fmt" }
wolf_project = { package = "wolfpack-project", path = "../crates/wolf_project" }

[[bin]]
name = "lexer"
path = "fuzz_targets/lexer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pipeline"
path = "fuzz_targets/pipeline.rs"
test = false
doc = false
bench = false

[workspace]
